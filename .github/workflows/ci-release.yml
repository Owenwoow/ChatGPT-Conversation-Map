name: 测试与发布

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:extension
        timeout-minutes: 10
        env:
          EXTENSION_TEST_BROWSER: msedge
      - name: 检查版本一致性
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw manifest.json | ConvertFrom-Json
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $lock = Get-Content -Raw package-lock.json | ConvertFrom-Json -AsHashTable
          if ($manifest.version -ne $package.version -or $manifest.version -ne $lock.version) {
            throw 'manifest.json、package.json 和 package-lock.json 的版本不一致。'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
            throw '标签必须与 manifest.json 的版本一致，例如 v1.0.4。'
          }
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: release
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 安装与更新

          - **首次安装**　下载下方的扩展 ZIP，解压到名称不带版本号的固定目录。在 `chrome://extensions` 或 `edge://extensions` 开启开发者模式，点击「加载已解压的扩展程序」，选择直接包含 `manifest.json` 的目录，再刷新 ChatGPT 标签页。
          - **已有用户更新**　将新版 ZIP 内的文件替换到原来加载的目录，保持 `manifest.json` 的位置不变。在扩展管理页点击该扩展的「重新加载」，再刷新已打开的 ChatGPT 标签页。
          EOF
          gh release create "$RELEASE_TAG" release/*.zip --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --generate-notes
