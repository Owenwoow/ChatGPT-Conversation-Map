  <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#213f30" flood-opacity=".09"/></filter>
</defs>
<rect width="1440" height="900" rx="28" fill="url(#canvas)"/>
<g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Microsoft YaHei, sans-serif" fill="#233d31">
