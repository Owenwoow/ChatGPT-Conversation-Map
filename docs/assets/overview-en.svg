<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">A map for your conversations.</title>
<desc id="description">Navigate by turn. Read by section. Keep your data local. FEATURE ILLUSTRATION · NOT A SCREENSHOT</desc>
<defs>
