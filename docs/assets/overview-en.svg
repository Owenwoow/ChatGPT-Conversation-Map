  </g>
  <text x="114" y="750" font-size="19" font-weight="650">01  Return to a turn</text>
  <text x="562" y="750" font-size="19" font-weight="650">02  Jump to a section</text>
  <text x="1010" y="750" font-size="19" font-weight="650">03  Save useful blocks</text>
  <text x="56" y="798" font-size="16" fill="#6f8175">Preview, jump, and bookmark what matters.</text>
  <text x="504" y="798" font-size="16" fill="#6f8175">A live heading tree that follows your scroll.</text>
  <text x="952" y="798" font-size="16" fill="#6f8175">Hover to copy static cards to your notes.</text>
</g>
