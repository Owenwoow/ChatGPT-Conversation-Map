  <text x="162" y="405" font-size="11" fill="#7a897f">TURN 8</text>
  <path d="M379 394h10v16l-5-3-5 3Z" fill="#c39b42"/>
  <text x="162" y="434" font-size="14" font-weight="600">How can I turn an idea into…</text>
  <text x="162" y="461" font-size="12" fill="#7a897f">Break the goal into steps, so…</text>

  <rect x="466" y="248" width="491" height="48" rx="14" fill="#eff3f0"/>
  <text x="486" y="278" font-size="16">How can I turn an idea into an actionable plan?</text>
  <text x="459" y="334" font-size="13" font-weight="600" fill="#789182">ChatGPT</text>
  <text x="459" y="368" font-size="14" fill="#64796c">Break the goal into steps, so each discussion moves things forward.</text>
  <text x="459" y="414" font-size="26" font-weight="650">From goals to action</text>
  <text x="459" y="457" font-size="19" font-weight="600">01  Define the goal</text>
  <text x="459" y="488" font-size="13.5" fill="#718277">Describe the outcome first, then build a practical path toward it.</text>
  <text x="459" y="530" font-size="19" font-weight="600">02  Break it down</text>
  <rect x="459" y="549" width="238" height="98" rx="11" fill="#edf4ef" stroke="#deebe2"/>
  <rect x="711" y="549" width="238" height="98" rx="11" fill="#f6f5ef" stroke="#eae7d8"/>
  <text x="478" y="582" font-size="15" font-weight="600">The goal</text>
  <text x="478" y="613" font-size="13" fill="#718277">Name the problem to solve</text>
  <text x="730" y="582" font-size="15" font-weight="600">Next step</text>
  <text x="730" y="613" font-size="13" fill="#718277">Start with one concrete action</text>
  <rect x="668" y="560" width="14" height="14" rx="2" fill="none" stroke="#6d8d79" stroke-width="1.4"/>
  <path d="M664 570v-13a2 2 0 0 1 2-2h12" fill="none" stroke="#6d8d79" stroke-width="1.4"/>

  <text x="1040" y="262" font-size="13" font-weight="600" fill="#76867b">Answer outline</text>
  <path d="M1347 255h13" stroke="#9aa99f" stroke-width="2"/>
  <text x="1054" y="316" font-size="16" font-weight="600">From goals to action</text>
  <path d="m1034 305 4 5 4-5" fill="none" stroke="#6c8273" stroke-width="1.5"/>
  <path d="M1041 333v139" stroke="#dce5df"/>
  <rect x="1050" y="340" width="278" height="39" rx="8" fill="#ecf3ee"/>
  <text x="1066" y="365" font-size="15" fill="#3e664b">Define the goal</text>
  <text x="1066" y="410" font-size="15" fill="#7a897f">Break it down</text>
  <text x="1066" y="455" font-size="15" fill="#7a897f">Review and adjust</text>
  <circle cx="1323" cy="359" r="4" fill="#739c81"/>

  <g fill="#e0e9e2"><circle cx="78" cy="744" r="22"/><circle cx="526" cy="744" r="22"/><circle cx="974" cy="744" r="22"/></g>
  <g fill="none" stroke="#55735e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
