<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Dual Navigator 验证场景</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#252525;font:15px/1.85 system-ui,sans-serif}html.dark body{background:#212121;color:#ececec}.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;padding:24px;background:#f9f9f9;font-size:13px}.dark .sidebar{background:#171717}.sidebar strong{display:block;margin-bottom:22px}.sidebar p{opacity:.6;font-size:12px}.top{position:fixed;top:0;left:240px;right:0;height:64px;background:inherit;z-index:2;padding:16px 28px;font-size:18px;font-weight:500}main{margin-left:240px;padding-top:90px}.thread{max-width:720px;margin:auto;padding-bottom:200px}.user{max-width:80%;background:#f4f4f4;border-radius:20px;padding:12px 20px;margin:30px 0 28px auto; width:fit-content}.dark .user{background:#303030}.markdown{padding:4px 0 50px}.markdown h1{font-size:27px;font-weight:600;letter-spacing:-.5px}.markdown h2{font-size:21px;margin-top:36px}.markdown h3{font-size:17px;margin-top:24px}p{margin:14px 0}code,pre{background:#f5f5f5;border-radius:10px;padding:12px;font:13px/1.6 monospace}.dark code,.dark pre{background:#171717}.composer{position:fixed;bottom:0;left:240px;right:0;background:inherit;padding:10px 0 24px;z-index:2}.input{width:720px;max-width:80%;margin:auto;border:1px solid #ddd;border-radius:25px;padding:16px 22px;color:#888;background:inherit}.caption{font-size:11px;text-align:center;color:#999;margin-top:9px}blockquote{border-left:3px solid #aaa;margin-left:0;padding-left:20px;color:#888}
</style></head><body><aside class="sidebar"><strong>ChatGPT</strong><p>＋ 新聊天</p><p>⌕ 搜索聊天</p><br><p>你的聊天</p>计算机网络学习笔记<p>操作系统 · 进程与线程</p><p>周末的学习计划</p></aside><div class="top">ChatGPT <span style="font-size:12px;color:#888">⌄</span></div><main><div class="thread" id="thread"></div></main><footer class="composer"><div class="input">询问任何问题 <span style="float:right">↑</span></div><div class="caption">ChatGPT 也可能会犯错。请核查重要信息。</div></footer><script>
const thread=document.querySelector('#thread');
window.addTurn=(i,content)=>{
 const u=document.createElement('article');u.dataset.testid=`conversation-turn-${i*2}`;u.innerHTML=`<div class="user" data-message-author-role="user" data-message-id="u${i}">第 ${i+1} 个问题：请帮我梳理计算机网络的知识结构。</div>`;
 const a=document.createElement('article');a.dataset.testid=`conversation-turn-${i*2+1}`;a.innerHTML=`<div data-message-author-role="assistant" data-message-id="a${i}"><div class="markdown">${content||`<h1>计算机网络 · 学习笔记 ${i+1}</h1><p>我们从日常使用网络的场景出发，逐层理解数据如何从一台计算机到达另一台计算机。</p><h2>一、TCP 协议</h2><p>TCP 为应用提供可靠、有序的数据传输。连接的建立与断开，是理解协议运行机制的起点。</p><h3>1. 三次握手</h3><p>客户端发送 SYN，服务器返回 SYN 与 ACK，客户端再发送 ACK。双方确认发送和接收能力后开始传输。</p><p>序列号用于标记数据的位置，确认号表示接下来期望收到的数据。</p><h3>2. 四次挥手</h3><p>连接的两个方向分别关闭。当一方完成发送后，可以先关闭发送方向，同时继续接收对方的数据。</p><h2>二、UDP 协议</h2><p>UDP 使用独立的数据报传递消息，适合对实时性有要求的应用场景。</p><h3>1. 工作原理</h3><p>每个数据报携带端口、长度与校验信息。应用需要根据需求处理丢包与顺序。</p><blockquote>学习建议：结合一次抓包，观察实际的数据流。</blockquote><h2>三、知识小结</h2><p>理解协议的目标，再观察它如何通过具体字段实现这些目标。</p>`}</div></div>`;
 thread.append(u,a);return a;
};for(let i=0;i<8;i++)addTurn(i);
</script></body></html>
