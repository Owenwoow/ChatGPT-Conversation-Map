<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>ChatGPT 对话地图</title></head>
<body><header><span class="mark">≡</span><div><strong>ChatGPT 对话地图</strong><p>长对话，也能轻松找到方向</p></div></header>
<main>
<label><span>对话小地图<small>在页面左侧定位历史提问</small></span><input type="checkbox" id="leftEnabled" role="switch"></label>
<label><span>回答目录<small>在页面右侧浏览章节结构</small></span><input type="checkbox" id="rightEnabled" role="switch"></label>
<label for="outlineWidth"><span>目录宽度<small>空间不足时自动收窄</small></span><select id="outlineWidth"><option value="auto">自动</option><option value="narrow">窄（240 像素）</option><option value="medium">中（320 像素）</option><option value="wide">宽（400 像素）</option></select></label>
<label><span>生成时自动展开<small>跟随新回答的标题更新</small></span><input type="checkbox" id="autoExpand" role="switch"></label>
<label><span>自动收起<small>自动展开的目录离开后收起；手动展开则保持</small></span><input type="checkbox" id="autoCollapse" role="switch"></label>
<label><span>沉浸模式<small>每次发送消息后自动收起网页侧边栏</small></span><input type="checkbox" id="immersiveMode" role="switch"></label>
</main><footer>仅本地处理 · 不上传聊天内容<p id="status" role="status">设置自动保存，即时生效</p></footer><script src="settings.js"></script></body></html>
