<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>对话笔记本</title>
  <link rel="stylesheet" href="notebook.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">◇</span><h1>对话笔记本</h1></div>
    <div id="board-tools" class="toolbar" hidden>
      <button id="new-note" type="button">新建笔记</button>
      <button id="new-group" type="button">新建主题</button>
      <button id="fold-groups" type="button">收拢支线</button>
      <button id="start-view" type="button">回到起点</button>
      <button id="fit-view" type="button">查看全图</button>
    </div>
  </header>
  <main>
    <aside class="library" aria-label="素材">
      <h2>最近的笔记本</h2>
      <select id="recent" aria-label="打开其他笔记本"></select>
      <div id="sources" hidden>
        <header class="section-head"><h2>对话轮次</h2><button id="refresh-turns" type="button">刷新</button></header>
        <p id="source-hint" class="muted">拖进画布，或点击卡片上的「＋」。</p>
        <ul id="turns"></ul>
        <h2 id="clips-title" hidden>划词摘录</h2>
        <ul id="clips"></ul>
        <button id="open-chat" type="button">打开原会话</button>
      </div>
    </aside>
    <section id="viewport" aria-label="笔记画布，方向键平移" tabindex="0">
      <div id="plane"><svg id="links" aria-hidden="true"></svg><div id="groups"></div><div id="cards"></div></div>
      <div id="empty" class="empty"><h2>把想法摆到一起</h2><p>从 ChatGPT 标签页打开扩展，或选择一个已保存的笔记本。</p></div>
      <div id="zoom-tools" class="zoom" hidden>
        <button id="zoom-out" type="button" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" type="button" aria-label="放大">＋</button>
      </div>
    </section>
    <aside id="details" class="details" aria-label="编辑卡片" hidden>
      <form id="edit">
        <header class="section-head"><h2 id="edit-heading">笔记</h2><button id="close-details" type="button">关闭</button></header>
        <label>标题<input id="title" maxlength="180" required></label>
        <label id="note-label">笔记<textarea id="note" rows="6" maxlength="12000"></textarea></label>
        <blockquote id="excerpt" hidden></blockquote>
        <label id="group-label">归入主题<select id="group"></select></label>
        <button type="submit" class="primary">保存</button>
      </form>
      <div class="detail-actions">
        <a id="go-to-source" class="button-link" target="_blank" rel="noopener noreferrer">查看原文</a>
        <button id="set-start" type="button">设为起点</button>
        <button id="connect" type="button">连接到…</button>
        <label id="unlink-label" hidden>已有连线<select id="unlink"></select><button id="remove-link" type="button">移除连线</button></label>
        <button id="delete" type="button">从画布移除</button>
      </div>
    </aside>
  </main>
  <div id="status" role="status" hidden></div>
  <script src="../src/mind-map-model.js"></script>
  <script src="../src/notebook-model.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
